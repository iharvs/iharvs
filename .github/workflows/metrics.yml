
name: Metrics

on:
  # Update Metrics hourly
  schedule:
    - cron: "0 * * * *"

    # Update streak stats daily at 3:00 AM Manila time (UTC+8)
    - cron: "0 19 * * *"

  workflow_dispatch:

  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.classic.svg
          token: ${{ secrets.METRICS_TOKEN }}

          user: iharvs
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Manila
          commits_authoring: iharvs, iharvs@users.noreply.github.com

          plugin_languages: yes
          plugin_languages_skipped: iharvs
          plugin_languages_limit: 24
          plugin_languages_threshold: 0%
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_recent_days: 14

      - name: Full-year calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.isocalendar.fullyear.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

  streak-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=transparent&disable_animations=true&hide_border=true&short_numbers=true&date_format=j%20M%5B%20Y%5D&fire=EB5454&ring=EB5454&border=EB5454&stroke=EB5454&sideNums=EB5454&sideLabels=777777&excludeDaysLabel=777777&currStreakLabel=777777&dates=575757&currStreakNum=EB5454
          path: profile/streak.svg

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
